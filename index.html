<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>القائمة الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Tajawal', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border: none;
    outline: none;
  }

  body {
    position: relative;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .bg {
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 30%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.5) 75%, rgba(0,0,0,0.95) 100%),
      url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200&q=80') center/cover no-repeat;
    filter: brightness(0.55) saturate(1.2);
    z-index: 0;
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(100, 50, 180, 0.15) 0%, transparent 60%);
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(15px + var(--sat)) 15px calc(15px + var(--sab)) 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 240px;
    margin: 0 auto;
  }

  .card {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(145deg, rgba(75, 28, 130, 0.95), rgba(38, 14, 70, 0.98));
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 
      0 5px 15px rgba(0, 0, 0, 0.5),
      0 0 12px rgba(180, 140, 255, 0.15);
    backdrop-filter: blur(12px);
    border: none;
    outline: none;
  }

  .card:active {
    transform: scale(0.92);
  }

  .card:hover {
    box-shadow: 
      0 8px 20px rgba(0, 0, 0, 0.6),
      0 0 20px rgba(180, 140, 255, 0.35);
  }

  .card.center {
    grid-column: 1 / -1;
    width: calc((100% - 14px) / 2);
    justify-self: center;
  }

  .icon {
    width: 40%;
    max-width: 38px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 100%;
    height: 100%;
  }

  .label {
    font-size: clamp(0.85rem, 3.2vw, 0.95rem);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    letter-spacing: 0.5px;
  }

  @media (max-height: 650px) {
    .grid {
      gap: 12px;
      max-width: 210px;
    }
    .card {
      border-radius: 16px;
    }
    .card.center {
      width: calc((100% - 12px) / 2);
    }
  }

  /* ============================================
     CHANNELS PLAYER VIEW
     ============================================ */
  .channels-view {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #0a0618;
    display: none;
    flex-direction: column;
    padding-top: var(--sat);
    padding-bottom: var(--sab);
  }

  .channels-view.active {
    display: flex;
  }

  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    flex-shrink: 0;
  }

  .player-wrap video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }

  .back-btn {
    position: absolute;
    top: 4px;
    left: 8px;
    z-index: 20;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    cursor: pointer;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0px 2px 6px rgba(0, 0, 0, 0.9));
  }
  
  .back-btn svg {
    width: 30px;
    height: 30px;
  }

  #playerStatus {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b39ddb;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    background: #0a0618;
    pointer-events: none;
  }

  .channels-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .cat-list {
    width: 110px;
    overflow-y: auto;
    background: #120a24;
    padding: 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .cat-list::-webkit-scrollbar,
  .ch-list::-webkit-scrollbar {
    display: none;
  }

  .cat-item {
    padding: 14px 8px;
    font-size: 12px;
    font-weight: 700;
    color: #b39ddb;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    word-break: break-word;
    line-height: 1.3;
    border: none;
  }

  .cat-item:hover {
    background: rgba(75, 28, 130, 0.4);
  }

  .cat-item.active {
    background: #4b1c82;
    color: #fff;
  }

  .ch-list {
    flex: 1;
    overflow-y: auto;
    background: #0a0618;
    padding: 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .ch-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    cursor: pointer;
    background: transparent;
    transition: background 0.2s;
    border: none;
  }

  .ch-item:hover,
  .ch-item.active {
    background: rgba(75, 28, 130, 0.5);
  }

  .ch-num {
    font-size: 12px;
    color: #7e6ca8;
    font-weight: 900;
    min-width: 22px;
    text-align: center;
  }

  .ch-icon {
    width: 34px;
    height: 34px;
    border-radius: 4px;
    background: #150e26;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin: 0 10px;
    flex-shrink: 0;
  }

  .ch-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .ch-icon .ch-icon-placeholder {
    color: #4a2a80;
    font-size: 16px;
    font-weight: 900;
  }

  .ch-name {
    font-size: 13px;
    font-weight: 700;
    color: #e0d0ff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .list-loading,
  .list-error,
  .list-empty {
    padding: 24px 12px;
    text-align: center;
    color: #b39ddb;
    font-size: 13px;
    font-weight: 700;
  }
  .list-error { color: #ff7777; }

  @media (max-width: 360px) {
    .cat-list { width: 95px; }
    .cat-item { font-size: 11px; padding: 12px 5px; }
    .ch-name { font-size: 12px; }
  }

  /* ============================================
     SCHEDULE VIEW
     ============================================ */
  .schedule-view {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #0a0618;
    display: none;
    flex-direction: column;
    padding-top: var(--sat);
    padding-bottom: var(--sab);
  }

  .schedule-view.active {
    display: flex;
  }

  .schedule-header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 12px 16px;
    background: #0a0618;
    flex-shrink: 0;
  }

  .schedule-header .back-btn {
    position: static;
    color: #d8c4ff;
    filter: none;
    margin-right: auto;
  }

  .schedule-header .back-btn svg {
    width: 26px;
    height: 26px;
  }

  .schedule-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .schedule-body::-webkit-scrollbar {
    display: none;
  }

  .match-card {
    position: relative;
    background: linear-gradient(145deg, #1a1030 0%, #0f0a1e 100%);
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    border: none;
  }

  .match-card:active {
    transform: scale(0.98);
  }

  .match-top {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 12px;
  }

  .match-status-badge {
    font-size: 10px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: none;
  }

  .match-status-badge.live {
    background: rgba(255, 60, 60, 0.2);
    color: #ff6b6b;
    animation: pulse-live 1.5s infinite;
  }

  .match-status-badge.final {
    background: rgba(160, 160, 160, 0.15);
    color: #aaa;
  }

  .match-status-badge.scheduled {
    background: rgba(100, 200, 255, 0.15);
    color: #6bc5ff;
  }

  @keyframes pulse-live {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .match-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .team-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .team-logo {
    width: 55px;
    height: 55px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
  }

  .team-logo-placeholder {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #2a1a4a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7e6ca8;
    font-size: 20px;
    font-weight: 900;
  }

  .team-name {
    font-size: 13px;
    font-weight: 700;
    color: #e0d0ff;
    text-align: center;
    line-height: 1.3;
    width: 100%;
    max-width: 110px;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .score-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 80px;
  }

  .score-numbers {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-num {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    line-height: 1;
  }

  .score-num.winner {
    color: #c9a0ff;
  }

  .score-divider {
    font-size: 18px;
    font-weight: 900;
    color: #5a4a7a;
  }

  .match-time-display {
    font-size: 16px;
    font-weight: 900;
    color: #fff;
    line-height: 1.2;
  }
  
  .match-date-display {
    font-size: 11px;
    font-weight: 700;
    color: #b39ddb;
    margin-top: 2px;
    text-align: center;
    line-height: 1.2;
  }

  .schedule-loading,
  .schedule-error {
    padding: 40px 20px;
    text-align: center;
    color: #b39ddb;
    font-size: 14px;
    font-weight: 700;
  }
  .schedule-error { color: #ff7777; }

  /* ============================================
     NEWS VIEW
     ============================================ */
  .news-view {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #0a0618;
    display: none;
    flex-direction: column;
    padding-top: var(--sat);
    padding-bottom: var(--sab);
  }

  .news-view.active {
    display: flex;
  }

  .news-header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 12px 16px;
    background: #0a0618;
    flex-shrink: 0;
  }

  .news-header .back-btn {
    position: static;
    color: #d8c4ff;
    filter: none;
    margin-right: auto;
  }

  .news-header .back-btn svg {
    width: 26px;
    height: 26px;
  }

  .news-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .news-body::-webkit-scrollbar {
    display: none;
  }

  .news-card {
    position: relative;
    background: linear-gradient(145deg, #1a1030 0%, #0f0a1e 100%);
    border-radius: 18px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    border: none;
  }

  .news-card:active {
    transform: scale(0.98);
  }

  .news-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #150e26;
  }

  .news-content {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .news-title {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .news-desc {
    font-size: 13px;
    font-weight: 500;
    color: #b39ddb;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .news-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #7e6ca8;
  }

  .news-source {
    color: #c9a0ff;
  }

  .news-loading,
  .news-error {
    padding: 40px 20px;
    text-align: center;
    color: #b39ddb;
    font-size: 14px;
    font-weight: 700;
  }
  .news-error { color: #ff7777; }

  /* ============================================
     VOD VIEW (MOVIES + SERIES)
     ============================================ */
  .vod-view {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #0a0618;
    display: none;
    flex-direction: column;
    padding-top: var(--sat);
    padding-bottom: var(--sab);
  }

  .vod-view.active { display: flex; }

  .vod-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
    background: #0a0618;
    flex-shrink: 0;
  }

  .vod-header .back-btn {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #d8c4ff;
    filter: none;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vod-header .back-btn svg {
    width: 26px;
    height: 26px;
  }

  .vod-tabs {
    display: flex;
    gap: 6px;
    justify-content: center;
  }

  .vod-tab {
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(75, 28, 130, 0.35);
    color: #b39ddb;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    outline: none;
  }

  .vod-tab.active {
    background: linear-gradient(145deg, #6c2eb8, #4b1c82);
    color: #fff;
    box-shadow: 0 0 10px rgba(201, 160, 255, 0.4);
    border: none;
    outline: none;
  }

  .vod-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .vod-body::-webkit-scrollbar { display: none; }

  .vod-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .vod-card {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(145deg, #1a1030, #0f0a1e);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    border: none;
  }

  .vod-card:active { transform: scale(0.95); }

  .vod-card:hover {
    box-shadow: 0 0 14px rgba(201, 160, 255, 0.4);
  }

  .vod-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #150e26;
  }

  .vod-card .vod-poster-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #4a2a80;
    background: linear-gradient(145deg, #1a1030, #0f0a1e);
  }

  .vod-card .vod-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 9px;
    font-weight: 900;
    padding: 2px 7px;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    letter-spacing: 0.3px;
    border: none;
  }

  .vod-card .vod-badge.movie {
    background: rgba(233, 30, 99, 0.85);
    color: #fff;
  }

  .vod-card .vod-badge.series {
    background: rgba(66, 165, 245, 0.85);
    color: #fff;
  }

  .vod-card .vod-title {
    position: absolute;
    inset: auto 0 0 0;
    padding: 20px 6px 6px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.75) 50%, transparent);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 40px;
  }

  .vod-card .vod-rating {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 9px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: #ffd54f;
    backdrop-filter: blur(4px);
  }

  .vod-loading,
  .vod-error,
  .vod-empty {
    grid-column: 1 / -1;
    padding: 40px 20px;
    text-align: center;
    color: #b39ddb;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.6;
  }
  .vod-error { color: #ff7777; }

  .vod-retry-btn {
    display: inline-block;
    margin-top: 14px;
    padding: 9px 20px;
    border-radius: 12px;
    background: linear-gradient(145deg, #6c2eb8, #4b1c82);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    border: none;
    outline: none;
  }
  .vod-retry-btn:active { transform: scale(0.95); }

  /* ============================================
     EPISODES VIEW
     ============================================ */
  .episodes-view {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: #0a0618;
    display: none;
    flex-direction: column;
    padding-top: var(--sat);
    padding-bottom: var(--sab);
  }

  .episodes-view.active { display: flex; }

  .episodes-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: #0a0618;
    flex-shrink: 0;
  }

  .episodes-header .back-btn {
    position: static;
    color: #d8c4ff;
    filter: none;
    padding: 4px;
  }

  .episodes-header .back-btn svg {
    width: 26px;
    height: 26px;
  }

  .episodes-title {
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .episodes-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 24px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .episodes-body::-webkit-scrollbar { display: none; }

  .season-title {
    font-size: 13px;
    font-weight: 900;
    color: #c9a0ff;
    margin: 14px 4px 8px;
    padding-bottom: 6px;
  }

  .episode-item {
    display: flex;
    align-items: center;
    gap: 10px;

    height: 28px;

  .vod-player-view {

    flex-direction: column;
    padding-top: var(--sat);
    padding-bottom: var(--sab);
  }

  .vod-player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    flex-shrink: 0;
  }

  .vod-player-wrap video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;

    font-weight: 900;
    color: #fff;

    font-size: 11px;
    font-weight: 700;
    color: #b39ddb;
  }

    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b39ddb;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 10px;

    pointer-events: none;

    font-weight: 900;
    color: #fff;

  async function translateText(text) {
    if (!text) return '';
    try {
      const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=${encodeURIComponent(text)}`);
      if (!res.ok) throw new Error('Translation failed');
      const data = await res.json();
      return data[0].map(item => item[0]).join('');
    } catch (e) {
      console.warn('Translation error, using original text:', e);
      return text;
    }
  }

  /* ==========================================================

     ========================================================== */
  async function loadSchedule() {
    const body = document.getElementById('scheduleBody');
    body.innerHTML = `<div class="schedule-loading">${t('loading_matches')}</div>`;

    try {
      const res = await fetch(SCHEDULE_API);
      if (!res.ok) throw new Error('Failed');
      const data = await res.json();
      const events = data.events || [];

      if (!events.length) {
        body.innerHTML = `<div class="schedule-loading">${t('no_content')}</div>`;
        scheduleLoaded = true;
        return;
      }

      let html = '';
      events.forEach(ev => {
        html += renderMatchCard(ev);
      });

      body.innerHTML = html;
      scheduleLoaded = true;

    } catch (err) {
      console.error('Schedule error:', err);
      body.innerHTML = `<div class="schedule-error">${t('error_load')}<br><small style="opacity:.7">${escapeHtml(err.message || '')}</small></div>`;
    }
  }

  function renderMatchCard(ev) {
    const comp = ev.competitions && ev.competitions[0];
    if (!comp) return '';

    const competitors = comp.competitors || [];
    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];

    if (!home || !away) return '';

    const homeTeam = home.team || {};
    const awayTeam = away.team || {};

    const homeName = getArabicTeamName(homeTeam.displayName || homeTeam.shortDisplayName);
    const awayName = getArabicTeamName(awayTeam.displayName || awayTeam.shortDisplayName);

    const defaultLogo = 'https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-500.png';
    const homeLogo = homeTeam.logo || defaultLogo;
    const awayLogo = awayTeam.logo || defaultLogo;

    const homeScore = home.score !== undefined ? home.score : '-';
    const awayScore = away.score !== undefined ? away.score : '-';

    const status = ev.status || {};
    const statusType = status.type || {};
    const state = statusType.state || 'pre';

    let statusClass = 'scheduled';
    let statusText = currentLang === 'ar' ? 'لم تبدأ' : 'Upcoming';
    if (state === 'in') {
      statusClass = 'live';
      statusText = currentLang === 'ar' ? 'مباشر' : 'Live';
    } else if (state === 'post') {
      statusClass = 'final';
      statusText = currentLang === 'ar' ? 'انتهت' : 'Final';
    }

    let scoreDisplay = '';
    if (state === 'pre') {
      const matchDate = new Date(ev.date);
      const timeString = matchDate.toLocaleTimeString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { hour: '2-digit', minute: '2-digit' });
      const dateString = matchDate.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { weekday: 'long', month: 'long', day: 'numeric' }).replace('،', '');

      scoreDisplay = `
        <div class="score-side">
          <div class="match-time-display">${timeString}</div>
          <div class="match-date-display">${dateString}</div>
        </div>
      `;
    } else {
      const homeWin = home.winner === true;
      const awayWin = away.winner === true;
      scoreDisplay = `
        <div class="score-side">
          <div class="score-numbers">
            <span class="score-num ${homeWin ? 'winner' : ''}">${homeScore}</span>
            <span class="score-divider">:</span>
            <span class="score-num ${awayWin ? 'winner' : ''}">${awayScore}</span>
          </div>
        </div>
      `;
    }

    return `
      <div class="match-card">
        <div class="match-top">
          <span class="match-status-badge ${statusClass}">${statusText}</span>
        </div>

        <div class="match-content">
          <div class="team-side">
            <img class="team-logo" src="${escapeHtml(homeLogo)}" alt="" onerror="this.src='${defaultLogo}'">
            <div class="team-name">${escapeHtml(homeName)}</div>
          </div>

          ${scoreDisplay}

          <div class="team-side">
            <img class="team-logo" src="${escapeHtml(awayLogo)}" alt="" onerror="this.src='${defaultLogo}'">
            <div class="team-name">${escapeHtml(awayName)}</div>
          </div>
        </div>
      </div>
    `;
  }

  async function loadNews() {
    const body = document.getElementById('newsBody');
    body.innerHTML = `<div class="news-loading">${t('loading_news')}</div>`;

    try {
      const res = await fetch(NEWS_API);
      if (!res.ok) throw new Error('Failed');
      const data = await res.json();
      const articles = data.articles || [];

      if (!articles.length) {
        body.innerHTML = `<div class="news-loading">${t('no_content')}</div>`;
        newsLoaded = true;
        return;
      }

      const translationPromises = articles.map(async (article) => {
        const translatedTitle = await translateText(article.headline || 'No Title');
        const translatedDesc = await translateText(article.description || '');
        return renderNewsCard(article, translatedTitle, translatedDesc);
      });

      const cardsHtml = await Promise.all(translationPromises);
      
      body.innerHTML = cardsHtml.join('');
      newsLoaded = true;

    } catch (err) {
      console.error('News error:', err);
      body.innerHTML = `<div class="news-error">${t('error_load')}<br><small style="opacity:.7">${escapeHtml(err.message || '')}</small></div>`;
    }
  }

  function renderNewsCard(article, translatedTitle, translatedDesc) {
    const image = article.images && article.images[0] ? article.images[0].url : '';
    const source = currentLang === 'ar' ? "نجم الشاشات" : "Screen Star";
    
    const pubDate = article.published ? new Date(article.published) : null;
    let dateString = '';
    if (pubDate) {
      dateString = pubDate.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    return `
      <div class="news-card">
        ${image ? `<img class="news-image" src="${escapeHtml(image)}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="news-content">
          <div class="news-title">${escapeHtml(translatedTitle)}</div>
          ${translatedDesc ? `<div class="news-desc">${escapeHtml(translatedDesc)}</div>` : ''}
          <div class="news-meta">
            <span class="news-source">${escapeHtml(source)}</span>
            <span>${dateString}</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderCategories() {
    const catList = document.getElementById('catList');
    let html = `<div class="cat-item ${currentCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all')">${t('all')}</div>`;

    categories.forEach(cat => {
      const id = String(cat.category_id);
      const name = escapeHtml(cat.category_name || '---');
      html += `<div class="cat-item ${currentCategory === id ? 'active' : ''}" onclick="selectCategory('${id}')">${name}</div>`;
    });

    catList.innerHTML = html;
  }

  function selectCategory(id) {
    currentCategory = id;
    document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
    const items = document.querySelectorAll('.cat-item');
    const cats  = categories;
    if (id === 'all') {
      if (items[0]) items[0].classList.add('active');
    } else {
      const idx = cats.findIndex(c => String(c.category_id) === id);
      if (idx >= 0 && items[idx + 1]) items[idx + 1].classList.add('active');
    }

    renderChannels();
    document.getElementById('chList').scrollTop = 0;
  }

  function renderChannels() {
    const chList = document.getElementById('chList');

    const filtered = (currentCategory === 'all')
      ? allChannels
      : allChannels.filter(c => String(c.category_id) === String(currentCategory));

    if (!filtered.length) {
      chList.innerHTML = `<div class="list-empty">${t('no_content')}</div>`;
      return;
    }

    const frag = document.createDocumentFragment();

    filtered.forEach((ch, i) => {
      const item = document.createElement('div');
      item.className = 'ch-item' + (String(ch.stream_id) === String(activeStreamId) ? ' active' : '');
      item.dataset.streamId = ch.stream_id;
      item.onclick = () => playChannelByStreamId(ch.stream_id);

      const num = document.createElement('div');
      num.className = 'ch-num';
      num.textContent = i + 1;

      const icon = document.createElement('div');
      icon.className = 'ch-icon';
      if (ch.stream_icon) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = ch.stream_icon;
        img.alt = '';
        img.onerror = () => { img.style.display = 'none'; icon.innerHTML = '<span class="ch-icon-placeholder">📺</span>'; };
        icon.appendChild(img);
      } else {
        icon.innerHTML = '<span class="ch-icon-placeholder">📺</span>';
      }

      const name = document.createElement('div');
      name.className = 'ch-name';
      name.textContent = ch.name || '---';

      item.appendChild(num);
      item.appendChild(icon);
      item.appendChild(name);
      frag.appendChild(item);
    });

    chList.innerHTML = '';
    chList.appendChild(frag);
  }

  function playChannelByStreamId(streamId) {
    const ch = allChannels.find(c => String(c.stream_id) === String(streamId));
    if (!ch) return;
    playChannel(ch);
  }

  function playChannel(ch) {
    const player = document.getElementById('player');
    const status = document.getElementById('playerStatus');

    activeStreamId = ch.stream_id;

    document.querySelectorAll('.ch-item').forEach(el => {
      el.classList.toggle('active', String(el.dataset.streamId) === String(ch.stream_id));
    });

    if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
    try { player.pause(); } catch(e){}
    player.removeAttribute('src');
    player.load();

    status.style.display = 'flex';
    status.textContent = t('connecting');

    const url = `${CONFIG.host}/live/${encodeURIComponent(CONFIG.username)}/${encodeURIComponent(CONFIG.password)}/${ch.stream_id}.m3u8`;

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30
      });
      hls.loadSource(url);
      hls.attachMedia(player);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.style.display = 'none';
        player.play().catch(() => {});
      });

      hls.on(Hls.Events.ERROR, (evt, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              status.style.display = 'flex';
              status.textContent = '⚠️ Network Error, retrying...';
              try { hls.startLoad(); } catch(e){}
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              status.style.display = 'flex';
              status.textContent = '⚠️ Media Error, recovering...';
              try { hls.recoverMediaError(); } catch(e){}
              break;
            default:
              status.style.display = 'flex';
              status.textContent = t('play_error');
              try { hls.destroy(); } catch(e){}
              hls = null;
              break;
          }
        }
      });

    } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
      player.src = url;
      player.addEventListener('loadedmetadata', () => {
        status.style.display = 'none';
        player.play().catch(() => {});
      }, { once: true });
      player.addEventListener('error', () => {
        status.style.display = 'flex';
        status.textContent = t('play_error');
      }, { once: true });
    } else {
      status.style.display = 'flex';
      status.textContent = '❌ HLS not supported';
    }
  }

    if (!vodLoaded && !vodLoading) loadVod();
  }

  function closeVod() {
    document.getElementById('vodView').classList.remove('active');
  }

  async function fetchJsonWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      clearTimeout(timer);
      throw e;
    }
  }

  function readVodCache() {
    try {
      const raw = localStorage.getItem(VOD_CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !obj.t) return null;
      if (Date.now() - obj.t > VOD_CACHE_TTL) return null;
      return obj;
    } catch (e) { return null; }
  }

  function writeVodCache() {
    try {
      const m = vodMovies.slice(0, VOD_CACHE_MAX_PER_TYPE);
      const s = vodSeries.slice(0, VOD_CACHE_MAX_PER_TYPE);
      localStorage.setItem(VOD_CACHE_KEY, JSON.stringify({
        t: Date.now(),
        movies: m,
        series: s
      }));
    } catch (e) {
      console.warn('vod cache write failed', e);
    }
  }

  function saveSeriesInfoCache() {
    try {
      const entries = Object.entries(seriesInfoCache)
        .filter(([k, v]) => v && v.episodes)
        .sort((a, b) => (b[1].t || 0) - (a[1].t || 0))
        .slice(0, 100);
      localStorage.setItem(SERIES_INFO_CACHE_KEY, JSON.stringify(Object.fromEntries(entries)));
    } catch (e) {
      try {
        const entries = Object.entries(seriesInfoCache)
          .filter(([k, v]) => v && v.episodes)
          .sort((a, b) => (b[1].t || 0) - (a[1].t || 0))
          .slice(0, 30);
        localStorage.setItem(SERIES_INFO_CACHE_KEY, JSON.stringify(Object.fromEntries(entries)));
      } catch (e2) {
        console.warn('series info cache save failed', e2);
      }
    }
  }

  async function fetchSeriesInfo(seriesId) {
    seriesId = String(seriesId);

    const cached = seriesInfoCache[seriesId];
    if (cached && cached.episodes && (Date.now() - (cached.t || 0)) < SERIES_INFO_TTL) {
      return cached;
    }

    if (seriesInfoLoading[seriesId]) {
      return seriesInfoLoading[seriesId];
    }

    const promise = (async () => {
      try {
        const url = `${VOD_CONFIG.host}/player_api.php?username=${encodeURIComponent(VOD_CONFIG.username)}&password=${encodeURIComponent(VOD_CONFIG.password)}&action=get_series_info&series_id=${seriesId}`;
        const data = await fetchJsonWithTimeout(url, VOD_FETCH_TIMEOUT);
        const episodes = (data && data.episodes) || {};
        const entry = { t: Date.now(), episodes };
        seriesInfoCache[seriesId] = entry;
        saveSeriesInfoCache();
        return entry;
      } finally {
        delete seriesInfoLoading[seriesId];
      }
    })();

    seriesInfoLoading[seriesId] = promise;
    return promise;
  }

  async function preloadTopSeries() {
    if (seriesPreloadStarted) return;
    if (!vodSeries.length) return;
    seriesPreloadStarted = true;

    const CONCURRENCY = 5;
    const MAX_PRELOAD = 60;

    const queue = [];
    for (let i = 0; i < Math.min(MAX_PRELOAD, vodSeries.length); i++) {
      const s = vodSeries[i];
      const sid = String(s.id);
      if (!seriesInfoCache[sid] || !seriesInfoCache[sid].episodes) {
        queue.push(sid);
      }
    }

    if (!queue.length) return;

    let idx = 0;
    async function worker() {
      while (idx < queue.length) {
        const sid = queue[idx++];
        try {
          await fetchSeriesInfo(sid);
        } catch (e) {}
      }
    }

    const workers = [];
    for (let i = 0; i < CONCURRENCY; i++) workers.push(worker());
    await Promise.allSettled(workers);
  }

  async function loadVod() {
    vodLoading = true;
    const grid = document.getElementById('vodGrid');

    const cached = readVodCache();
    if (cached && ((cached.movies && cached.movies.length) || (cached.series && cached.series.length))) {
      vodMovies = cached.movies || [];
      vodSeries = cached.series || [];
      vodLoaded = true;
      vodLoading = false;
      finalizeVod();
      return;
    }

    grid.innerHTML = `<div class="vod-loading">${t('loading_vod')}</div>`;

    const base = `${VOD_CONFIG.host}/player_api.php?username=${encodeURIComponent(VOD_CONFIG.username)}&password=${encodeURIComponent(VOD_CONFIG.password)}`;

    let pending = 2;
    let hasError = false;

    const onOneDone = (success) => {
      if (!success) hasError = true;
      pending--;
      if (pending === 0) {
        vodLoading = false;
        vodLoaded = true;
        if (vodMovies.length || vodSeries.length) {
          writeVodCache();
        }
        finalizeVod();
      } else {
        if (vodMovies.length || vodSeries.length) {
          renderVodGrid();
        }
      }
    };

    fetchJsonWithTimeout(`${base}&action=get_vod_streams`, VOD_FETCH_TIMEOUT)
      .then(data => {
        if (Array.isArray(data)) {
          vodMovies = data.map(m => ({
            type: 'movie',
            id: m.stream_id,
            title: m.name || '---',
            poster: m.stream_icon || '',
            rating: m.rating || '',
            ext: m.container_extension || 'mp4'
          }));
        }
        onOneDone(true);
      })
      .catch(e => {
        console.warn('vod movies error:', e);
        onOneDone(false);
      });

    fetchJsonWithTimeout(`${base}&action=get_series`, VOD_FETCH_TIMEOUT)
      .then(data => {
        if (Array.isArray(data)) {
          vodSeries = data.map(s => ({
            type: 'series',
            id: s.series_id,
            title: s.name || '---',
            poster: s.cover || '',
            rating: s.rating || ''
          }));
        }
        onOneDone(true);
      })
      .catch(e => {
        console.warn('vod series error:', e);
        onOneDone(false);
      });
  }

  function finalizeVod() {
    const grid = document.getElementById('vodGrid');
    if (!vodMovies.length && !vodSeries.length) {
      grid.innerHTML = `<div class="vod-empty">
        ❌ ${t('error_load')}<br>
        <small style="opacity:.7">${t('error_retry')}</small><br>
        <button class="vod-retry-btn" onclick="reloadVod()">${t('retry')}</button>
      </div>`;
      return;
    }
    const combined = interleaveVod(vodMovies, vodSeries);
    vodItems = combined.slice(0, VOD_CONFIG.maxItems);
    renderVodGrid();

    setTimeout(() => {
      preloadTopSeries().catch(e => console.warn('preload error', e));
    }, 300);
  }

  function reloadVod() {
    vodLoaded = false;
    vodLoading = false;
    vodMovies = [];
    vodSeries = [];
    vodItems = [];
    seriesPreloadStarted = false;
    try { localStorage.removeItem(VOD_CACHE_KEY); } catch(e){}
    loadVod();
  }

  function interleaveVod(movies, series) {
    const out = [];
    const max = Math.max(movies.length, series.length);
    for (let i = 0; i < max; i++) {
      if (movies[i]) out.push(movies[i]);
      if (series[i]) out.push(series[i]);
    }
    return out;
  }

  function setVodFilter(filter) {
    currentVodFilter = filter;
    document.querySelectorAll('.vod-tab').forEach(t_btn => {
      t_btn.classList.toggle('active', t_btn.dataset.filter === filter);
    });
    renderVodGrid();
  }

  function renderVodGrid() {
    const grid = document.getElementById('vodGrid');
    if (!grid) return;

    let list = vodItems;
    if (currentVodFilter === 'movie') list = vodItems.filter(x => x.type === 'movie');
    else if (currentVodFilter === 'series') list = vodItems.filter(x => x.type === 'series');

    if (!list.length) {
      grid.innerHTML = `<div class="vod-empty">${t('no_content')}</div>`;
      return;
    }

    const frag = document.createDocumentFragment();

    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'vod-card';
      card.onclick = () => onVodItemClick(item);

      const badge = document.createElement('div');
      badge.className = 'vod-badge ' + (item.type === 'movie' ? 'movie' : 'series');
      badge.textContent = item.type === 'movie' ? t('movie_badge') : t('series_badge');

      if (item.rating && parseFloat(item.rating) > 0) {
        const rating = document.createElement('div');
        rating.className = 'vod-rating';
        rating.textContent = '★ ' + parseFloat(item.rating).toFixed(1);
        card.appendChild(rating);
      }

      if (item.poster) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = item.poster;
        img.alt = item.title;
        img.onerror = () => {
          img.style.display = 'none';
          const fb = document.createElement('div');
          fb.className = 'vod-poster-fallback';
          fb.textContent = item.type === 'movie' ? '🎬' : '📺';
          card.insertBefore(fb, card.firstChild);
        };
        card.appendChild(img);
      } else {
        const fb = document.createElement('div');
        fb.className = 'vod-poster-fallback';
        fb.textContent = item.type === 'movie' ? '🎬' : '📺';
        card.appendChild(fb);
      }

      card.appendChild(badge);

      const title = document.createElement('div');
      title.className = 'vod-title';
      title.textContent = item.title;
      card.appendChild(title);

      frag.appendChild(card);
    });

    grid.innerHTML = '';
    grid.appendChild(frag);
  }

  function onVodItemClick(item) {
    if (item.type === 'movie') {
      playVodMovie(item);
    } else {
      openSeriesDetail(item);
    }
  }

  function playVodMovie(item) {
    const ext = item.ext || 'mp4';
    const url = `${VOD_CONFIG.host}/movie/${encodeURIComponent(VOD_CONFIG.username)}/${encodeURIComponent(VOD_CONFIG.password)}/${item.id}.${ext}`;
    openVodPlayer(url, item.title, t('movie_badge') + ' • ' + (item.rating ? '★ ' + item.rating : ''));
  }

  async function openSeriesDetail(item) {
    const seriesId = String(item.id);
    currentEpisodesSeriesName = item.title;
    document.getElementById('episodesTitle').textContent = item.title || t('series');
    document.getElementById('episodesView').classList.add('active');
    const body = document.getElementById('episodesBody');

    const cached = seriesInfoCache[seriesId];
    if (cached && cached.episodes && Object.keys(cached.episodes).length) {
      renderEpisodesToBody(cached.episodes, body);
      return;
    }

    if (seriesInfoLoading[seriesId]) {
      body.innerHTML = `<div class="vod-loading" style="padding:20px">${t('loading')}</div>`;
      try {
        const info = await seriesInfoLoading[seriesId];
        renderEpisodesToBody(info.episodes, body);
        return;
      } catch (e) {}
    }

    body.innerHTML = `<div class="vod-loading" style="padding:20px">${t('loading_episodes')}</div>`;
    try {
      const info = await fetchSeriesInfo(seriesId);
      renderEpisodesToBody(info.episodes, body);
    } catch (err) {
      body.innerHTML = `<div class="vod-error">
        ${t('error_load')}<br>
        <button class="vod-retry-btn" onclick="retrySeriesInfo('${escapeHtml(seriesId)}')">${t('retry')}</button>
      </div>`;
    }
  }

  function retrySeriesInfo(seriesId) {
    delete seriesInfoCache[String(seriesId)];
    const item = vodSeries.find(s => String(s.id) === String(seriesId));
    if (item) openSeriesDetail(item);
  }

  function renderEpisodesToBody(episodes, body) {
    const seasons = Object.keys(episodes).filter(k => !isNaN(k)).sort((a, b) => Number(a) - Number(b));

    if (!seasons.length) {
      body.innerHTML = `<div class="vod-empty">${t('no_content')}</div>`;
      return;
    }

    let html = '';
    seasons.forEach(seasonNum => {
      const eps = episodes[seasonNum] || [];
      if (!eps.length) return;
      html += `<div class="season-title">${t('season')} ${seasonNum}</div>`;
      eps.forEach(ep => {
        const epId = String(ep.id || '');
        if (!epId) return;
        episodesMap[epId] = ep;
        const epTitle = ep.title || (`${t('episode')} ` + (ep.episode_num || ''));
        const num = ep.episode_num || '';
        html += `
          <div class="episode-item" onclick="playEpisodeById('${epId}')">
            <span class="ep-num">${escapeHtml(String(num))}</span>
            <span class="ep-title">${escapeHtml(epTitle)}</span>
            <span class="ep-play">▶</span>
          </div>
        `;
      });
    });

    body.innerHTML = html || `<div class="vod-empty">${t('no_content')}</div>`;
  }

  function closeEpisodes() {
    document.getElementById('episodesView').classList.remove('active');
  }

  function playEpisodeById(epId) {
    const ep = episodesMap[epId];
    if (!ep) return;
    const ext = ep.container_extension || 'mp4';
    const url = `${VOD_CONFIG.host}/series/${encodeURIComponent(VOD_CONFIG.username)}/${encodeURIComponent(VOD_CONFIG.password)}/${epId}.${ext}`;
    const epLabel = t('season') + ' ' + (ep.season || '') + ' • ' + t('episode') + ' ' + (ep.episode_num || '');
    openVodPlayer(url, currentEpisodesSeriesName, epLabel);
  }

  function openVodPlayer(url, title, sub) {
    const view = document.getElementById('vodPlayerView');
    const player = document.getElementById('vodPlayer');
    const status = document.getElementById('vodPlayerStatus');

    view.classList.add('active');
    document.getElementById('vodPlayerTitle').textContent = title || '—';
    document.getElementById('vodPlayerSub').textContent = sub || '';

    if (vodHls) { try { vodHls.destroy(); } catch(e){} vodHls = null; }
    try { player.pause(); } catch(e){}
    player.removeAttribute('src');
    player.load();

    status.style.display = 'flex';
    status.textContent = t('loading_video');

    const isHls = /\.m3u8(\?|$)/i.test(url);

    if (isHls && window.Hls && Hls.isSupported()) {
      vodHls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 60
      });
      vodHls.loadSource(url);
      vodHls.attachMedia(player);

      vodHls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.style.display = 'none';
        player.play().catch(() => {});
      });

      vodHls.on(Hls.Events.ERROR, (evt, data) => {
        if (data.fatal) {
          status.style.display = 'flex';
          status.textContent = t('play_error');
          try { vodHls.destroy(); } catch(e){}
          vodHls = null;
        }
      });
    } else {
      player.src = url;
      player.addEventListener('loadedmetadata', () => {
        status.style.display = 'none';
        player.play().catch(() => {});
      }, { once: true });
      player.addEventListener('error', () => {
        status.style.display = 'flex';
        status.textContent = t('play_error');
      }, { once: true });
    }
  }

  function closeVodPlayer() {
    const view = document.getElementById('vodPlayerView');
    const player = document.getElementById('vodPlayer');
    view.classList.remove('active');

    if (vodHls) { try { vodHls.destroy(); } catch(e){} vodHls = null; }
    try { player.pause(); } catch(e){}
    player.removeAttribute('src');
    player.load();
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ==========================================================
     تشغيل الترجمة عند بدء التطبيق
     ========================================================== */
  document.addEventListener('DOMContentLoaded', () => {
    setLanguage(currentLang);
  });
  if (document.readyState !== 'loading') {
    setLanguage(currentLang);
  }
</script>
